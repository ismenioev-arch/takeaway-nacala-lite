server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Cabeçalhos de segurança (especificação, secção 25).
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Os ficheiros com hash no nome nunca mudam de conteúdo.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # A API é servida pelo backend.
  location /api/ {
    proxy_pass http://backend:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Notificações em tempo real (SSE) não podem ser guardadas em buffer.
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  # Aplicação de página única: qualquer rota devolve o index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
